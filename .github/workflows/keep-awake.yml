name: Keep awake

# Pings the Render free instance so it doesn't spin down after 15 idle minutes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://verso-ai-9exo.onrender.com/health
